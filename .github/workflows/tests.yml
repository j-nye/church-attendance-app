name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: church_attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_attendance_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/church_attendance_test
      - name: Seed the database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_attendance_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/church_attendance_test
          SEED_ADMIN_EMAIL: e2e-admin@example.com
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          AUTH_SECRET: ci-e2e-placeholder-not-a-real-secret
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/church_attendance_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/church_attendance_test
          SEED_ADMIN_EMAIL: e2e-admin@example.com
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Static analysis. Semgrep OSS runs on private repos for free, which is why it
  # is here — CodeQL cannot run until this repo goes public.
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config=p/typescript --config=p/nextjs --config=p/javascript --error src/
