name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning is unavailable on free private repos. When the repo goes
    # public, set the repository variable ENABLE_CODEQL to "true":
    #   gh variable set ENABLE_CODEQL --body true
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
